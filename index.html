<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0f0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GA RE Exam">
<title>GA Real Estate Exam — 14-Day Plan</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a0f0a; --bg2:#2d1810; --bg3:#3d2418; --bg-deep:#150a06;
    --line:#4a2818; --gold:#d4a574; --gold-dim:#a8825c; --gold-deep:#6b4a30;
    --rust:#8b3a1f; --rust2:#6b2d18; --copper:#c97e3f;
    --paper:#f5e6d3; --green:#3f6b4a;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--paper);font-family:'Fraunces',Georgia,serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  .sans{font-family:'DM Sans',system-ui,sans-serif}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  ul{list-style:none}
  em{color:var(--gold);font-style:italic}

  /* texture */
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.035;z-index:1;
    background-image:radial-gradient(circle at 20% 50%,#fff 1px,transparent 1px),radial-gradient(circle at 80% 80%,#fff 1px,transparent 1px);
    background-size:38px 38px,58px 58px}

  header{border-bottom:2px solid var(--rust);padding:28px 20px;
    background:linear-gradient(180deg,#2d1810,#1a0f0a);position:relative;z-index:2}
  .wrap{max-width:1100px;margin:0 auto}
  .eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .eyebrow .bar{width:36px;height:2px;background:var(--gold)}
  .eyebrow span{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
  h1{font-size:clamp(28px,6vw,50px);font-weight:400;letter-spacing:-.02em;line-height:1.08;margin-bottom:8px}
  .sub{color:var(--gold-dim);font-size:14px;max-width:640px;line-height:1.6}

  .pbar-wrap{margin-top:24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .pbar-outer{flex:1 1 260px;min-width:180px}
  .pbar-label{display:flex;justify-content:space-between;margin-bottom:6px;font-size:11px;
    color:var(--gold-dim);letter-spacing:.08em;text-transform:uppercase}
  .pbar{height:8px;background:var(--bg2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--copper),var(--gold));
    border-radius:4px;transition:width .5s cubic-bezier(.4,0,.2,1)}
  .reset{border:1px solid var(--line);color:var(--gold-dim);padding:8px 13px;font-size:10px;
    letter-spacing:.1em;text-transform:uppercase}
  .reset:active{background:var(--bg2)}

  nav{border-bottom:1px solid var(--line);background:rgba(21,10,6,.92);position:sticky;top:0;z-index:20;
    backdrop-filter:blur(10px)}
  nav .inner{max-width:1100px;margin:0 auto;display:flex;overflow-x:auto;scrollbar-width:none}
  nav .inner::-webkit-scrollbar{display:none}
  .tab{padding:15px 16px;font-size:12px;letter-spacing:.04em;color:var(--gold-dim);
    border-bottom:2px solid transparent;white-space:nowrap;transition:color .2s}
  .tab.on{color:var(--paper);border-bottom-color:var(--gold)}

  main{max-width:1100px;margin:0 auto;padding:26px 20px 90px;position:relative;z-index:2}

  /* cards / grids */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:34px}
  .stat{background:var(--bg2);border:1px solid var(--line);padding:18px}
  .stat .k{font-size:10px;color:var(--gold-dim);letter-spacing:.18em;text-transform:uppercase;margin-bottom:7px}
  .stat .v{font-size:28px;color:var(--gold)}
  .stat .s{font-size:12px;color:var(--gold-dim);margin-top:3px}

  h2{font-size:24px;font-weight:400;margin-bottom:6px}
  h2 small{color:var(--gold-dim);font-size:13px;letter-spacing:.1em}
  .lead{color:var(--gold-dim);font-size:14px;line-height:1.6;margin-bottom:22px}

  .bars{background:var(--bg2);border:1px solid var(--line)}
  .row{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:14px}
  .row:last-child{border-bottom:none}
  .row .name{flex:0 0 160px;font-size:14px}
  .row .track{flex:1;position:relative;height:24px;background:var(--bg);overflow:hidden}
  .row .track i{position:absolute;left:0;top:0;bottom:0;display:block}
  .row .track b{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11px;
    font-weight:600;color:var(--paper)}
  .row .pri{flex:0 0 66px;text-align:right;font-size:9px;letter-spacing:.12em}
  @media(max-width:560px){.row .name{flex:0 0 110px;font-size:13px}.row .pri{display:none}}

  .ga-grid{background:var(--bg2);border:1px solid var(--line);padding:22px;
    display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:8px}
  .ga-grid .h{font-size:10px;color:var(--gold);letter-spacing:.18em;margin-bottom:8px}
  .ga-grid li{color:var(--gold-dim);font-size:14px;line-height:1.85;padding-left:14px;position:relative}
  .ga-grid li:before{content:'→';position:absolute;left:0;color:var(--gold-deep)}

  /* day selector */
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:22px}
  .daybtn{background:var(--bg2);border:1px solid var(--line);padding:9px 3px;text-align:center;position:relative;transition:all .2s}
  .daybtn.on{background:var(--rust);border-color:var(--gold)}
  .daybtn.done{background:var(--bg3)}
  .daybtn .dl{font-size:9px;color:var(--gold-dim);letter-spacing:.08em}
  .daybtn .dn{font-size:19px;margin-top:1px}
  .daybtn .chk{position:absolute;top:3px;right:3px;font-size:10px;color:var(--gold)}
  .daybtn .mini{margin-top:4px;height:3px;background:var(--bg)}
  .daybtn .mini i{display:block;height:100%;background:var(--gold);transition:width .3s}

  .dhero{background:linear-gradient(135deg,var(--bg2),var(--bg3));border:1px solid var(--line);padding:26px;margin-bottom:20px}
  .dhero .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .dhero .wk{font-size:11px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase}
  .dhero h3{font-size:28px;font-weight:400;margin-top:3px}
  .dhero .focus{color:var(--gold-dim);font-style:italic;font-size:15px;margin-top:7px}
  .dhero .pct{text-align:right}
  .dhero .pct .pl{font-size:11px;color:var(--gold-dim);letter-spacing:.1em}
  .dhero .pct .pv{font-size:26px;color:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:11px;background:var(--bg);border:1px solid var(--line);padding:4px 10px;color:var(--gold)}

  .panel{background:var(--bg2);border:1px solid var(--line);margin-bottom:20px}
  .panel .hd{padding:15px 22px;border-bottom:1px solid var(--line);font-size:11px;color:var(--gold);
    letter-spacing:.2em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
  .task{display:flex;align-items:flex-start;gap:13px;padding:15px 22px;border-bottom:1px solid var(--line);
    width:100%;text-align:left;font-size:15px;line-height:1.5;transition:background .15s}
  .task:last-child{border-bottom:none}
  .task:active{background:var(--bg3)}
  .task .box{flex:0 0 20px;height:20px;border:2px solid var(--gold-deep);border-radius:5px;margin-top:1px;
    display:flex;align-items:center;justify-content:center;transition:all .2s}
  .task.done .box{background:var(--gold);border-color:var(--gold)}
  .task.done .box:after{content:'✓';color:var(--bg);font-size:13px;font-weight:700}
  .task.done .txt{text-decoration:line-through;opacity:.55}

  /* quiz */
  .q{margin-bottom:26px}
  .q:last-child{margin-bottom:0}
  .q .stem{font-size:15px;margin-bottom:11px;line-height:1.5}
  .q .stem b{color:var(--gold);margin-right:7px}
  .opt{display:block;width:100%;text-align:left;padding:11px 14px;margin-bottom:8px;font-size:14px;
    background:var(--bg);border:1px solid var(--line);transition:all .15s}
  .opt:active{border-color:var(--gold)}
  .opt.sel{background:var(--bg3);border-color:var(--gold)}
  .opt.correct{background:rgba(212,165,116,.16);border-color:var(--gold)}
  .opt.wrong{background:rgba(139,58,31,.32);border-color:var(--rust)}
  .opt .ltr{color:var(--gold-dim);margin-right:8px}
  .explain{margin-top:9px;padding:12px 14px;background:var(--bg);border-left:3px solid var(--gold);
    font-size:13px;color:var(--gold-dim);line-height:1.6}
  .explain b{color:var(--gold)}
  .submit{margin-top:18px;background:var(--rust);border:1px solid var(--gold);color:var(--paper);
    padding:12px 24px;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .submit:disabled{opacity:.4}
  .score{font-size:14px}
  .score.pass{color:var(--gold)}.score.fail{color:var(--copper)}

  .dnav{display:flex;gap:10px;margin-top:22px}
  .dnav button{flex:1;border:1px solid var(--line);color:var(--gold);padding:13px;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:7px}
  .dnav button.next{background:var(--rust);border-color:var(--gold);color:var(--paper)}

  /* flashcards */
  .fc-topics{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:22px}
  .fc-topic{border:1px solid var(--line);color:var(--gold-dim);padding:7px 13px;font-size:12px;text-transform:capitalize}
  .fc-topic.on{background:var(--rust);color:var(--paper)}
  .card{min-height:300px;padding:38px;border:1px solid var(--line);display:flex;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;position:relative;transition:all .3s;
    background:linear-gradient(135deg,var(--bg2),var(--bg))}
  .card.flip{background:linear-gradient(135deg,var(--bg3),var(--bg2))}
  .card .meta{position:absolute;top:14px;right:18px;font-size:10px;color:var(--gold-dim);letter-spacing:.18em;text-transform:uppercase}
  .card .side{font-size:11px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase;margin-bottom:18px}
  .card .front{font-size:clamp(26px,4.5vw,38px);line-height:1.3}
  .card .back{font-size:17px;line-height:1.5;max-width:620px}
  .card .hint{position:absolute;bottom:14px;font-size:11px;color:var(--gold-deep);letter-spacing:.1em}
  .fc-nav{display:flex;gap:8px;margin-top:14px}
  .fc-nav button{flex:1;border:1px solid var(--line);color:var(--gold);padding:13px;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase}
  .fc-nav button.flip{background:var(--rust);border-color:var(--gold);color:var(--paper)}
  .fc-nav button:disabled{opacity:.4}

  /* formulas */
  .f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
  .f-card{background:var(--bg2);border:1px solid var(--line);padding:18px}
  .f-card .ft{font-size:11px;color:var(--gold);letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}
  .f-card .ff{font-size:17px;margin-bottom:10px}
  .f-card .fn{font-size:13px;color:var(--gold-dim);line-height:1.5}

  /* cheat sheet */
  .cheat-section{font-size:13px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;
    margin:34px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line);font-weight:400}
  .cheat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:18px}
  .cheat-card{background:var(--bg2);border:1px solid var(--line);padding:18px}
  .cheat-card .cheat-title{font-size:15px;color:var(--paper);margin-bottom:10px;font-weight:500;line-height:1.3}
  .cheat-clue{font-size:13px;color:var(--gold-dim);margin-bottom:8px;font-style:italic;line-height:1.5}
  .cheat-clue b{color:var(--gold);font-style:normal}
  .cheat-formula{background:var(--bg);border-left:3px solid var(--gold);padding:10px 12px;
    font-size:14px;line-height:1.6;margin-bottom:8px;font-family:Georgia,serif}
  .cheat-ex{font-size:13px;color:var(--paper);margin-bottom:10px;line-height:1.5}
  .cheat-ex b{color:var(--gold)}
  .cheat-trap{background:rgba(201,126,63,.10);border-left:3px solid var(--copper);
    padding:9px 12px;font-size:12.5px;color:var(--gold-dim);line-height:1.5;font-style:italic}
  .cheat-rule{font-size:14px;color:var(--paper);line-height:1.7;margin-bottom:10px}
  .cheat-rule b{color:var(--gold)}
  .cheat-bul{margin:6px 0 12px 18px;color:var(--paper);font-size:13.5px;line-height:1.7}
  .cheat-bul li{margin-bottom:3px}
  .cheat-table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:14px}
  .cheat-table th,.cheat-table td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
  .cheat-table th{color:var(--gold);font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:600}
  .cheat-table td:last-child{color:var(--gold);font-weight:500}
  .cheat-golden{background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--gold);
    padding:18px 22px;margin-bottom:18px}
  .cheat-golden.top10{background:linear-gradient(135deg,var(--rust2),var(--bg3));border:1px solid var(--copper)}
  .cheat-golden.top10 li{margin-bottom:4px}
  .cheat-h{font-size:13px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:10px}
  .cheat-golden ol,.cheat-golden ul{margin-left:20px;color:var(--paper);font-size:14px;line-height:1.8}
  .cheat-golden b{color:var(--gold)}

  /* tips */
  .tip-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;margin-bottom:28px}
  .tip{background:var(--bg2);border:1px solid var(--line);padding:22px}
  .tip h4{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:400;margin-bottom:14px;letter-spacing:.04em}
  .tip h4 .ic{color:var(--gold)}
  .tip li{color:var(--gold-dim);font-size:14px;line-height:1.9;padding-left:16px;position:relative}
  .tip li:before{content:'→';position:absolute;left:0;color:var(--gold-deep)}
  .callout{background:linear-gradient(135deg,var(--rust),var(--rust2));border:1px solid var(--gold);padding:28px}
  .callout h4{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:400;margin-bottom:11px}
  .callout p{font-size:14px;line-height:1.7}
  .note{margin-top:20px;background:var(--bg2);border:1px solid var(--line);padding:22px}
  .note h4{font-size:13px;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:11px}
  .note p{color:var(--gold-dim);font-size:14px;line-height:1.7}

  footer{border-top:1px solid var(--line);padding:22px;text-align:center;color:var(--gold-deep);
    font-size:11px;letter-spacing:.12em;position:relative;z-index:2}

  .fade{animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* exam countdown */
  .dual-cd{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
  @media(max-width:680px){.dual-cd{grid-template-columns:1fr}}
  .dual-cd .countdown{margin-bottom:0}
  .countdown{display:flex;justify-content:space-between;align-items:center;gap:14px;
    background:linear-gradient(135deg,var(--rust),var(--rust2));border:1px solid var(--gold);
    padding:20px 24px;margin-bottom:24px;flex-wrap:wrap}
  .countdown.set{background:var(--bg2);border:1px dashed var(--line)}
  .countdown.urgent{animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{border-color:var(--gold)}50%{border-color:var(--copper)}}
  .cd-big{font-size:34px;line-height:1.05;color:var(--paper)}
  .cd-label{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-top:4px}
  .cd-sub{font-size:13px;color:var(--gold-dim);margin-top:4px}
  .cd-input{background:var(--bg);border:1px solid var(--line);color:var(--paper);padding:10px 12px;font-size:16px;border-radius:4px}
  .cd-setrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .cd-setbtn{background:var(--gold);color:var(--bg);border:none;padding:11px 22px;font-size:13px;
    letter-spacing:.1em;text-transform:uppercase;border-radius:4px;font-weight:600}
  .cd-setbtn:active{background:var(--copper)}
  .cd-edit{border:1px solid var(--gold);color:var(--paper);padding:8px 16px;font-size:11px;letter-spacing:.1em;text-transform:uppercase}

  /* tab notification badge */
  .tabbadge{display:inline-block;margin-left:6px;background:var(--copper);color:var(--bg);
    font-size:10px;font-weight:600;padding:1px 6px;border-radius:9px;vertical-align:middle}

  /* mock exam progress bar */
  .mock-bar{display:flex;justify-content:space-between;align-items:center;
    background:var(--bg2);border:1px solid var(--line);padding:12px 18px;margin-bottom:16px;
    position:sticky;top:48px;z-index:15;font-size:13px;color:var(--gold)}
  .mock-bar #mockTimer{color:var(--gold-dim)}

  /* daily flashcard shortcut */
  .fc-shortcut{display:block;width:100%;text-align:center;padding:14px 18px;margin-bottom:20px;
    background:linear-gradient(135deg,var(--bg3),var(--bg2));border:1px solid var(--gold);
    color:var(--gold);font-size:14px;letter-spacing:.04em;transition:all .2s;cursor:pointer}
  .fc-shortcut:active,.fc-shortcut:hover{background:var(--rust);color:var(--paper)}
</style>
</head>
<body>
<div class="grain"></div>

<header>
  <div class="wrap">
    <div class="eyebrow"><div class="bar"></div><span class="sans" id="eyebrowText">Twenty-Eight Days to License</span></div>
    <h1>Georgia Real Estate <em>Salesperson</em> Exam</h1>
    <p class="sub sans">A guaranteed-progress plan. 152 questions, two portions, 4 hours, 75% to pass each. Built to the PSI content outline and your Kaplan schedule.</p>
    <div class="pbar-wrap">
      <div class="pbar-outer">
        <div class="pbar-label sans"><span>Overall Progress</span><span id="ovText">0 / 0 · 0%</span></div>
        <div class="pbar"><i id="ovBar" style="width:0%"></i></div>
      </div>
      <button class="reset sans" id="resetBtn">↺ Reset</button>
    </div>
  </div>
</header>

<nav><div class="inner" id="tabs"></div></nav>
<main id="view"></main>
<footer class="sans">BUILT TO THE PSI GEORGIA CONTENT OUTLINE · YOU GOT THIS</footer>

<script>
/* ============================ DATA ============================ */
const PLAN = [
  {day:1,week:1,title:'Diagnostic & Foundation',focus:'Baseline test + Real Property Basics',
   topics:['Bundle of rights','Real vs personal property','Fixtures'],
   tasks:['Take Kaplan diagnostic practice test (DO NOT study first — get a true baseline)','Read Kaplan Unit 1: Real Property & The Law','Watch any "LEARN National Laws" session today (4pm, 11am, or 8pm)','Memorize the 6 sticks: Bundle of Rights = DEEP-PIE (Disposition, Encumbrance, Enjoyment, Possession, Income, Exclusion)','Memorize fixture test: MARIA (Method, Adaptability, Relationship, Intention, Agreement)','Complete Day 1 mini-quiz below (target 70%)']},
  {day:2,week:1,title:'Estates & Ownership',focus:'Freehold/leasehold estates, Co-ownership',
   topics:['Fee simple','Life estates','Joint tenancy','Tenancy in common','Condo vs co-op'],
   tasks:['Read Kaplan unit on Estates in Land','Attend LEARN National Laws session (1.25 hrs)','Memorize 4 unities of joint tenancy: PITT (Possession, Interest, Time, Title)','Flashcards: Fee Simple, Life Estate, Pur Autre Vie, Remainder, Reversion','Practice 25 Kaplan questions on Property Ownership (target 75%)','Complete Day 2 mini-quiz below']},
  {day:3,week:1,title:'Land Use & Legal Descriptions',focus:'Government rights, Encumbrances, Descriptions',
   topics:['PETE powers','Liens','Easements','Encroachments','Zoning'],
   tasks:['Read Kaplan units on Land Use Controls + Legal Descriptions','Attend LEARN National Laws session','Memorize PETE: Police power, Eminent domain, Taxation, Escheat','Memorize 3 legal description methods: Metes & Bounds, Lot & Block, Rectangular Survey','Memorize easement types: appurtenant, in gross, by necessity, by prescription','Practice 25 Kaplan questions on Land Use (target 75%)','Complete Day 3 mini-quiz below']},
  {day:4,week:1,title:'Agency Law',focus:'Fiduciary duties, Agency relationships (13% of exam)',
   topics:['OLD CAR duties','Agency creation','Sub-agency','Buyer agency','Dual agency'],

// every question the user answered WRONG on a submitted quiz
function missedList(){
  const out=[];
  for(const k in QUIZZES){
    if(!S.submitted['q'+k])continue;
    QUIZZES[k].forEach((it,i)=>{
      const ans=S.answers['q'+k+'_'+i];

        out.push({day:+k,topic:DAY_TOPIC[k]||('Day '+k),q:it.q,o:it.o,a:it.a,e:it.e,your:ans});
      }
    });
  }

// per-topic score from submitted quizzes
function topicStats(){
  const m={};
  for(const k in QUIZZES){
    if(!S.submitted['q'+k])continue;
    const t=DAY_TOPIC[k]||('Day '+k);
    let c=0;QUIZZES[k].forEach((it,i)=>{if(S.answers['q'+k+'_'+i]===it.a)c++;});
    if(!m[t])m[t]={correct:0,total:0};
    m[t].correct+=c;m[t].total+=QUIZZES[k].length;
  }
  return Object.keys(m).map(t=>({topic:t,pct:Math.round(m[t].correct/m[t].total*100),correct:m[t].correct,total:m[t].total})).sort((a,b)=>a.pct-b.pct);
}

// days remaining until a given exam date string (null if not set or past)
function daysUntilDate(dateStr){
  if(!dateStr)return null;
  const exam=new Date(dateStr+'T00:00:00');
  if(isNaN(exam.getTime()))return null;
  const now=new Date();now.setHours(0,0,0,0);
  return Math.round((exam-now)/(1000*60*60*24));
}

// for the header tagline: return the soonest upcoming exam in {label, days}, or null
function nextUpcomingExam(){
  const k=daysUntilDate(S.kaplanDate), p=daysUntilDate(S.psiDate);
  const opts=[];
  if(k!==null && k>=0) opts.push({label:'Kaplan', days:k, date:S.kaplanDate});
  if(p!==null && p>=0) opts.push({label:'PSI', days:p, date:S.psiDate});
  if(opts.length===0){
    // both either unset or both past — return whichever past one is closest if any
    const past=[];
    if(k!==null && k<0) past.push({label:'Kaplan', days:k, date:S.kaplanDate});
    if(p!==null && p<0) past.push({label:'PSI', days:p, date:S.psiDate});
    if(past.length===0)return null;
    return past.sort((a,b)=>b.days-a.days)[0]; // closest past
  }
  return opts.sort((a,b)=>a.days-b.days)[0]; // soonest upcoming
}

// legacy helper kept for any old references
function daysUntilExam(){return daysUntilDate(S.psiDate||S.kaplanDate);}

// ---- Mock exam: pull a balanced 50-question set from all quiz banks ----
function buildMock(){
  const pool=[];
  for(const k in QUIZZES){QUIZZES[k].forEach((it,i)=>pool.push({day:+k,qi:i,topic:DAY_TOPIC[k]||('Day '+k),q:it.q,o:it.o,a:it.a,e:it.e}));}
  // shuffle (Fisher-Yates)
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  return pool.slice(0,50);
}

  // dynamic eyebrow tagline: switches to a live countdown once exam date is set
  const eb=$('#eyebrowText');
  if(eb){

    if(next===null) eb.textContent='Twenty-Eight Days to License';
    else if(next.days<0) eb.textContent='Hope you crushed it';
    else if(next.days===0) eb.textContent=next.label+' exam · TODAY';
    else if(next.days===1) eb.textContent='1 day to your '+next.label+' exam';

    eb.style.color = (next!==null && next.days<=3 && next.days>=0) ? 'var(--copper)' : '';
  }
}

    h+='<div class="panel"><div class="hd sans">Your Topic Scores</div><div style="padding:18px 22px">';
    stats.forEach(s=>{
      const col=s.pct>=80?'var(--gold)':s.pct>=70?'var(--copper)':'#c0563a';
      h+=`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${s.topic}</span><span class="sans" style="color:${col}">${s.pct}% (${s.correct}/${s.total})</span></div><div style="height:8px;background:var(--bg);border:1px solid var(--line);overflow:hidden"><i style="display:block;height:100%;width:${s.pct}%;background:${col}"></i></div></div>`;
    });
    const weakest=stats[0];
    if(weakest&&weakest.pct<80)h+=`<div style="margin-top:8px;padding:12px 14px;background:var(--bg);border-left:3px solid var(--copper);font-size:13px;color:var(--gold-dim)"><b style="color:var(--gold)">Focus here:</b> Your lowest topic is <b style="color:var(--paper)">${weakest.topic}</b> at ${weakest.pct}%. Re-drill it before exam day.</div>`;
    h+='</div></div>';
  }else{
    h+='<div class="panel"><div style="padding:26px;text-align:center;color:var(--gold-dim)">Take some daily quizzes first — your topic scores and missed questions will appear here.</div></div>';
  }

  // missed questions review
  if(missed.length){
    if(missIdx>=missed.length)missIdx=0;
    const m=missed[missIdx];
    h+=`<div class="panel"><div class="hd sans"><span>Missed Questions · ${missIdx+1} of ${missed.length}</span><span class="score" style="color:var(--copper)">${m.topic}</span></div><div style="padding:22px">`;
    h+=`<div class="q"><div class="stem">${esc(m.q)}</div>`;
    m.o.forEach((op,oi)=>{
      let cls='opt';
      if(oi===m.a)cls+=' correct';
      else if(oi===m.your)cls+=' wrong';
      h+=`<div class="${cls}"><span class="ltr">${String.fromCharCode(65+oi)}.</span>${esc(op)}${oi===m.a?' <span class="sans" style="color:var(--gold);font-size:11px">✓ correct</span>':oi===m.your?' <span class="sans" style="color:var(--copper);font-size:11px">your pick</span>':''}</div>`;
    });
    h+=`<div class="explain"><b>Why:</b> ${esc(m.e)}</div></div>`;
    h+='<div class="fc-nav"><button class="sans" id="missPrev"'+(missIdx===0?' disabled':'')+'>‹ Prev</button><button class="sans" id="missDay">Go to Day '+m.day+'</button><button class="sans flip" id="missNext"'+(missIdx===missed.length-1?' disabled':'')+'>Next ›</button></div>';
    h+='</div></div>';
  }else if(stats.length){
    h+='<div class="panel"><div style="padding:26px;text-align:center;color:var(--gold)">🎉 No missed questions right now — nice work! Keep taking quizzes to stress-test yourself.</div></div>';
  }
  h+='</div>';
  return h;
}

function viewMock(){
  let h='<div class="fade"><h2>Mock Exam</h2><p class="lead">A timed, 50-question mixed exam pulled from all topics — to build pacing and stamina for the real 4-hour PSI test.</p>';
  const mk=S.mock;
  if(!mk||mk.done&&mk.review===undefined){
    // intro / results screen
    if(mk&&mk.done){
      const pct=Math.round(mk.correct/mk.questions.length*100);
      const pass=pct>=75;
      h+=`<div class="panel"><div style="padding:30px;text-align:center"><div class="sans" style="font-size:11px;letter-spacing:.2em;color:var(--gold-dim)">LAST MOCK SCORE</div><div style="font-size:60px;color:${pass?'var(--gold)':'var(--copper)'};line-height:1.1">${pct}%</div><div class="sans" style="color:var(--gold-dim);margin-bottom:6px">${mk.correct} of ${mk.questions.length} correct · ${Math.floor(mk.elapsed/60)}m ${mk.elapsed%60}s</div><div style="color:${pass?'var(--gold)':'var(--copper)'};font-size:15px">${pass?'✓ Above the 75% pass line — strong work':'Below 75% — keep drilling, you\u2019ll get there'}</div></div></div>`;
      h+='<div class="dnav"><button class="sans" id="mockReview">Review Answers</button><button class="sans flip" id="mockStart">New Mock Exam</button></div>';
    }else{
      h+='<div class="panel"><div style="padding:30px;text-align:center"><div style="font-size:15px;margin-bottom:8px">Ready when you are.</div><div class="sans" style="color:var(--gold-dim);font-size:13px;line-height:1.7">50 questions · ~45 min target<br>Pick your answers, then submit to see your score + explanations.<br>Tip: pace yourself at ~55 seconds per question.</div></div></div>';
      h+='<div class="dnav"><button class="sans flip" id="mockStart">Start Mock Exam</button></div>';
    }
    h+='</div>';return h;
  }
  // review mode of a finished mock
  if(mk.done&&mk.review){
    h+='<div class="panel"><div class="hd sans"><span>Mock Review · '+mk.questions.length+' questions</span><span class="score" style="color:var(--gold-dim)">Score '+Math.round(mk.correct/mk.questions.length*100)+'%</span></div><div style="padding:22px">';
    mk.questions.forEach((it,i)=>{
      const your=mk.answers[i];
      h+='<div class="q"><div class="stem"><b>'+(i+1)+'.</b>'+esc(it.q)+' <span class="sans" style="font-size:10px;color:var(--gold-deep)">['+it.topic+']</span></div>';
      it.o.forEach((op,oi)=>{
        let cls='opt';
        if(oi===it.a)cls+=' correct';else if(oi===your&&your!==it.a)cls+=' wrong';
        h+=`<div class="${cls}"><span class="ltr">${String.fromCharCode(65+oi)}.</span>${esc(op)}</div>`;
      });
      h+='<div class="explain"><b>Why:</b> '+esc(it.e)+'</div></div>';
    });
    h+='</div></div><div class="dnav"><button class="sans flip" id="mockStart">New Mock Exam</button></div></div>';
    return h;
  }
  // in-progress exam
  const answered=Object.keys(mk.answers).length;
  h+=`<div class="mock-bar"><div class="sans">${answered} / ${mk.questions.length} answered</div><div class="sans" id="mockTimer">timing…</div></div>`;
  h+='<div class="panel"><div style="padding:22px">';
  mk.questions.forEach((it,i)=>{
    h+='<div class="q"><div class="stem"><b>'+(i+1)+'.</b>'+esc(it.q)+'</div>';
    it.o.forEach((op,oi)=>{
      const sel=mk.answers[i]===oi;
      h+=`<button class="opt${sel?' sel':''}" data-mock="${i}" data-mo="${oi}"><span class="ltr">${String.fromCharCode(65+oi)}.</span>${esc(op)}</button>`;
    });
    h+='</div>';
  });
  h+=`<button class="submit sans" id="mockSubmit"${answered<mk.questions.length?' disabled':''}>Submit Mock Exam (${answered}/${mk.questions.length})</button>`;
  h+='</div></div></div>';
  return h;
}

/* ============================ RENDER + EVENTS ============================ */
let lastTab=null, lastDay=null;
function render(){
  renderTabs();
  let html='';
  if(tab==='overview')html=viewOverview();
  else if(tab==='plan')html=viewPlan();
  else if(tab==='review')html=viewReview();
  else if(tab==='mock')html=viewMock();
  else if(tab==='flashcards')html=viewFlashcards();
  else if(tab==='formulas')html=viewFormulas();
  else if(tab==='cheat')html=viewCheat();
  else if(tab==='tips')html=viewTips();
  $('#view').innerHTML=html;
  wire();
  updateHeader();
  startMockTimer();
  // only jump to top when the user navigates to a different tab or different day
  if(tab!==lastTab || (tab==='plan' && day!==lastDay)){
    window.scrollTo({top:0,behavior:'instant'});
  }
  lastTab=tab; lastDay=day;
}

let mockTimerId=null;
function startMockTimer(){
  if(mockTimerId){clearInterval(mockTimerId);mockTimerId=null;}
  const el=$('#mockTimer');
  if(!el||!S.mock||S.mock.done)return;
  if(!S.mock.start)S.mock.start=Date.now();
  const tick=()=>{
    const t=$('#mockTimer');if(!t){clearInterval(mockTimerId);return;}
    const s=Math.floor((Date.now()-S.mock.start)/1000);
    const m=Math.floor(s/60),sec=s%60;
    t.textContent=(m<10?'0':'')+m+':'+(sec<10?'0':'')+sec+' / 45:00 target';
  };
  tick();mockTimerId=setInterval(tick,1000);
}

function wire(){
  // day buttons
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=+b.dataset.day;render();});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{day=+b.dataset.go;render();});
  // tasks
  document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{
    const i=b.dataset.task;const k='d'+day+'t'+i;S.progress[k]=!S.progress[k];persist();render();
  });
  // quiz answers
  document.querySelectorAll('[data-q]').forEach(b=>{if(b.disabled)return;b.onclick=()=>{
    S.answers['q'+day+'_'+b.dataset.q]=+b.dataset.o;persist();render();
  };});
  const sq=$('#submitQuiz');if(sq)sq.onclick=()=>{S.submitted['q'+day]=true;persist();render();};
  const rq=$('#retakeQuiz');if(rq)rq.onclick=()=>{
    if(!confirm('Retake the Day '+day+' quiz? Your current answers for this day will be cleared.'))return;
    // clear this day's answers and submitted flag
    const quiz=QUIZZES[day];
    quiz.forEach((_,i)=>{delete S.answers['q'+day+'_'+i];});
    delete S.submitted['q'+day];
    persist();render();
  };
  // flashcards
  document.querySelectorAll('[data-fct]').forEach(b=>b.onclick=()=>{fcTopic=b.dataset.fct;fcIdx=0;fcFlip=false;tab='flashcards';render();});
  const card=$('#card');if(card)card.onclick=()=>{fcFlip=!fcFlip;render();};
  const fl=$('#fcFlip');if(fl)fl.onclick=e=>{e.stopPropagation();fcFlip=!fcFlip;render();};
  const fp=$('#fcPrev');if(fp)fp.onclick=e=>{e.stopPropagation();if(fcIdx>0){fcIdx--;fcFlip=false;render();}};
  const fn=$('#fcNext');if(fn)fn.onclick=e=>{e.stopPropagation();const list=fcTopic==='all'?FLASHCARDS:FLASHCARDS.filter(f=>f[0]===fcTopic);if(fcIdx<list.length-1){fcIdx++;fcFlip=false;render();}};

  // exam date setters — Kaplan + PSI
  const ki=$('#kaplanInput');if(ki)ki.onchange=()=>{ S._kaplanDraft=ki.value; };
  const ks=$('#kaplanSet');if(ks)ks.onclick=()=>{
    const v=(($('#kaplanInput')&&$('#kaplanInput').value)||S._kaplanDraft||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){alert('Please pick a full date first.');return;}
    const d=new Date(v+'T00:00:00');
    if(isNaN(d.getTime())||d.getFullYear()<2025){alert('Please pick a valid date.');return;}
    S.kaplanDate=v;S._kaplanDraft=null;persist();render();
  };
  const ke=$('#kaplanEdit');if(ke)ke.onclick=()=>{S.kaplanDate=null;persist();render();};

  const pi=$('#psiInput');if(pi)pi.onchange=()=>{ S._psiDraft=pi.value; };
  const ps=$('#psiSet');if(ps)ps.onclick=()=>{
    const v=(($('#psiInput')&&$('#psiInput').value)||S._psiDraft||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(v)){alert('Please pick a full date first.');return;}
    const d=new Date(v+'T00:00:00');
    if(isNaN(d.getTime())||d.getFullYear()<2025){alert('Please pick a valid date.');return;}
    S.psiDate=v;S._psiDraft=null;persist();render();
  };
  const pe=$('#psiEdit');if(pe)pe.onclick=()=>{S.psiDate=null;persist();render();};

  // missed-questions review nav
  const mp=$('#missPrev');if(mp)mp.onclick=()=>{if(missIdx>0){missIdx--;render();}};
  const mn=$('#missNext');if(mn)mn.onclick=()=>{const n=missedList().length;if(missIdx<n-1){missIdx++;render();}};
  const md=$('#missDay');if(md)md.onclick=()=>{const m=missedList()[missIdx];if(m){day=m.day;tab='plan';render();}};

  // mock exam controls
  const ms=$('#mockStart');if(ms)ms.onclick=()=>{S.mock={questions:buildMock(),answers:{},done:false,start:Date.now()};persist();render();};
  const mr=$('#mockReview');if(mr)mr.onclick=()=>{S.mock.review=true;persist();render();};
  document.querySelectorAll('[data-mock]').forEach(b=>b.onclick=()=>{
    if(!S.mock||S.mock.done)return;
    S.mock.answers[b.dataset.mock]=+b.dataset.mo;persist();render();
  });
  const msub=$('#mockSubmit');if(msub)msub.onclick=()=>{
    let c=0;S.mock.questions.forEach((it,i)=>{if(S.mock.answers[i]===it.a)c++;});
    S.mock.correct=c;S.mock.done=true;S.mock.review=undefined;
    S.mock.elapsed=Math.floor((Date.now()-S.mock.start)/1000);
    persist();render();
  };
}

$('#resetBtn').onclick=()=>{if(confirm('Reset ALL progress? This cannot be undone.')){S={progress:{},answers:{},submitted:{}};persist();day=1;tab='overview';render();}};

render();
</script>
